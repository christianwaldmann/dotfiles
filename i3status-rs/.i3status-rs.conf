icons_format = "{icon}"

[theme]
theme = "native"
[theme.overrides]
idle_fg = "#C8C8C8"

[icons]
icons = "awesome4"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
format = " Low disk space:$available.eng(range:..10e9) remaining |"

[[block]]
block = "memory"
format = " High memory usage: $mem_used_percents.eng(range:80..) |"

[[block]]
block = "cpu"
interval = 5
format = " High CPU usage: $utilization.eng(range:70..) |"

[[block]]
block = "time"
interval = 1
format = " $timestamp.datetime(f:'%H:%M') "

[[block]]
block = "battery"
interval = 1
missing_format = ""

